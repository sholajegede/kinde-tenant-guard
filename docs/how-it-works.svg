<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d3d3d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
  </defs>

  <text x="40" y="52" font-size="26" font-weight="700" fill="#111">One request, one organization's rows</text>
  <text x="40" y="82" font-size="16" fill="#555">The Kinde token decides the tenant. PostgreSQL enforces it on every query, even one that forgets its filter.</text>

  <!-- 1 token -->
  <rect x="40" y="130" width="230" height="150" rx="12" fill="#f4f4f5" stroke="#d4d4d8"/>
  <text x="60" y="162" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1">1. VERIFIED KINDE TOKEN</text>
  <text x="60" y="196" font-size="15" fill="#111" font-family="ui-monospace, Menlo, monospace">sub: kp_8f2c</text>
  <text x="60" y="222" font-size="15" fill="#111" font-family="ui-monospace, Menlo, monospace" font-weight="700">org_code: org_acme</text>
  <text x="60" y="248" font-size="15" fill="#111" font-family="ui-monospace, Menlo, monospace">permissions: [...]</text>

  <!-- 2 guard -->
  <rect x="330" y="130" width="270" height="150" rx="12" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="350" y="162" font-size="13" font-weight="700" fill="#4338ca" letter-spacing="1">2. TENANT GUARD</text>
  <text x="350" y="194" font-size="15" fill="#111">No org_code? Refused.</text>
  <text x="350" y="220" font-size="15" fill="#111">org_acme → tenant t_acme</text>
  <text x="350" y="246" font-size="15" fill="#111">Checks your permission policies</text>

  <!-- 3 transaction -->
  <rect x="660" y="130" width="250" height="150" rx="12" fill="#f4f4f5" stroke="#d4d4d8"/>
  <text x="680" y="162" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1">3. ONE TRANSACTION</text>
  <text x="680" y="196" font-size="14" fill="#111" font-family="ui-monospace, Menlo, monospace">set_config(</text>
  <text x="680" y="218" font-size="14" fill="#111" font-family="ui-monospace, Menlo, monospace">  'app.tenant_id',</text>
  <text x="680" y="240" font-size="14" fill="#111" font-family="ui-monospace, Menlo, monospace">  't_acme', true)</text>
  <text x="680" y="264" font-size="13" fill="#555">Gone when the transaction ends</text>

  <!-- 4 postgres -->
  <rect x="970" y="130" width="190" height="150" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="990" y="162" font-size="13" font-weight="700" fill="#047857" letter-spacing="1">4. POSTGRESQL</text>
  <text x="990" y="194" font-size="15" fill="#111">Row-level</text>
  <text x="990" y="216" font-size="15" fill="#111">security policy</text>
  <text x="990" y="246" font-size="15" fill="#111" font-weight="700">tenant_id = t_acme</text>

  <line x1="270" y1="205" x2="326" y2="205" stroke="#3d3d3d" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="205" x2="656" y2="205" stroke="#3d3d3d" stroke-width="2" marker-end="url(#a)"/>
  <line x1="910" y1="205" x2="966" y2="205" stroke="#3d3d3d" stroke-width="2" marker-end="url(#a)"/>

  <!-- query outcomes -->
  <text x="40" y="350" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1">WHAT YOUR CODE SENDS</text>
  <text x="700" y="350" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1">WHAT THE DATABASE DOES</text>

  <g font-size="15">
    <rect x="40" y="368" width="560" height="44" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
    <text x="58" y="396" fill="#111" font-family="ui-monospace, Menlo, monospace">select * from invoices    -- no where clause</text>
    <line x1="600" y1="390" x2="696" y2="390" stroke="#3d3d3d" stroke-width="2" marker-end="url(#a)"/>
    <text x="704" y="396" fill="#047857" font-weight="600">Returns only Acme's invoices</text>

    <rect x="40" y="422" width="560" height="44" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
    <text x="58" y="450" fill="#111" font-family="ui-monospace, Menlo, monospace">insert into projects (name) values (...)</text>
    <line x1="600" y1="444" x2="696" y2="444" stroke="#3d3d3d" stroke-width="2" marker-end="url(#a)"/>
    <text x="704" y="450" fill="#047857" font-weight="600">Stamps tenant_id = t_acme</text>

    <rect x="40" y="476" width="560" height="44" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
    <text x="58" y="504" fill="#111" font-family="ui-monospace, Menlo, monospace">update projects set tenant_id = 't_globex'</text>
    <line x1="600" y1="498" x2="696" y2="498" stroke="#c2410c" stroke-width="2" marker-end="url(#r)"/>
    <text x="704" y="504" fill="#c2410c" font-weight="600">Refused: violates row-level security</text>
  </g>
</svg>
